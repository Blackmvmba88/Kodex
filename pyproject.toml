[project]
name = "blackmamba-kodex"
version = "0.1.0"
description = "Local-first BlackMamba programming agent"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
  "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[project.scripts]
kodex = "agent.main:app"

[tool.setuptools.packages.find]
include = ["agent*"]
exclude = ["memory*", "tests*", "docs*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
