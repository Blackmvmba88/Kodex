name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests and command loop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest

      - name: Validate command loop JSON surfaces
        run: |
          kodex demo --json
          kodex modes --json
          kodex guide "quiero una onda sinusoidal" --json
          kodex lab "quiero una onda sinusoidal" --json
          kodex course "quiero una onda sinusoidal" --json
          kodex portfolio "quiero una onda sinusoidal" --json
          kodex showcase "quiero una onda sinusoidal" --json
          kodex review-gate "quiero una onda sinusoidal" --json
